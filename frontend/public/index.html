  window.onerror = function(message, source, lineno, colno, error) {
    try {
      var msg = 'Runtime error: ' + message + '\n' + (error && error.stack ? error.stack : 'no stack');
      alert(msg);
    } catch (e) {
      console.error('Error showing alert', e);
    }
    console.error('Window error:', message, source, lineno, colno, error);
    return false;
  };
</script>
