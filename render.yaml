services:
  - type: web
    name: skyteduellene-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn 'src.app:app'
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        production: sqlite:///skyteduellene.db
      - key: JWT_SECRET_KEY
        production: change-me-in-production