services:
  - type: web
    name: skyteduellene-api
    env: python
    plan: free
    # The API is the FastAPI app in backend/server.py (MongoDB-backed).
    # The previous startCommand (gunicorn 'src.app:app') ran an obsolete Flask
    # skeleton that is missing the routes the frontend calls:
    #   /api/duels, /api/settings, /api/tournaments, /api/leaderboard, ...
    # and whose CORS config blocks credentialed cross-origin POSTs
    # (register/login). Deploy backend/server.py instead.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DB_NAME
        value: skyteduellene
      # Frontend is served from https://skyteduellene.vercel.app.
      # A bare "*" is rejected by browsers when allow_credentials is true,
      # so the explicit origin allowlist below is required.
      - key: CORS_ORIGINS
        value: https://skyteduellene.vercel.app,https://skyteduellene.onrender.com
      # --- Secrets: manage these in the Render dashboard (do not commit values) ---
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMERGENT_LLM_KEY
        sync: false
